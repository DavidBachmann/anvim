base: lua51

# Homebrew's selene has no luajit feature, so `lua_versions: luajit` only
# prints an error. These globals stand in for the LuaJIT ones we use.
globals:
  Snacks:
    any: true
  vim:
    any: true
  jit:
    any: true
  bit:
    any: true
  assert:
    any: true
  describe:
    any: true
  it:
    any: true
  before_each:
    any: true
